name: release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.9 (defaults to the pushed tag)
        required: false
        type: string
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  check_version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version to release
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check that the version matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/aaykra/Cargo.toml | head -1)
          if [ "${version}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Release version ${{ steps.version.outputs.version }} does not match crates/aaykra/Cargo.toml version ${version}"
            exit 1
          fi
      - name: Check that the changelog has entries for this version
        run: script/changelog-section "${{ steps.version.outputs.version }}" >/dev/null

  bundle_mac:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            target_triple: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target_triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/aaykra/RELEASE_CHANNEL
      # Signing and notarization only happen when these secrets exist.
      # Without them the bundle is ad-hoc signed.
      - name: Prepare provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
            echo "MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac ${{ matrix.target_triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target_triple }}/release/aaykra-${{ matrix.arch }}.dmg
            target/aaykra-remote-server-macos-${{ matrix.arch }}.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dsym
          path: target/${{ matrix.target_triple }}/release/aaykra.dSYM.zip
          if-no-files-found: error

  bundle_linux:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/aaykra/RELEASE_CHANNEL
      - name: Bundle
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/aaykra-linux-${{ matrix.arch }}.tar.gz
            target/aaykra-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  bundle_deb:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/aaykra/RELEASE_CHANNEL
      - name: Build .deb package
        run: ./script/bundle-deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.arch }}
          path: target/release/aaykra*.deb
          if-no-files-found: error

  bundle_arch_linux:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install zstd for .pkg.tar.zst packaging
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/aaykra/RELEASE_CHANNEL
      - name: Build Arch Linux package
        run: ./script/bundle-arch
      - uses: actions/upload-artifact@v4
        with:
          name: arch-linux-${{ matrix.arch }}
          path: target/release/aaykra-*.pkg.tar.zst
          if-no-files-found: error

  bundle_windows:
    needs: check_version
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: Set-Content -Path crates/aaykra/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Bundle
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/aaykra-x86_64.exe
            target/aaykra-remote-server-windows-x86_64.gz
          if-no-files-found: error

  release:
    needs: [check_version, bundle_mac, bundle_linux, bundle_deb, bundle_arch_linux, bundle_windows]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --tags --force
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep debug symbols out of the release assets
        run: find artifacts -name '*.dSYM.zip' -delete
      - name: Publish legacy asset names so older installs can self-update
        run: |
          cd artifacts
          for arch in x86_64 aarch64; do
            [ -f "aaykra-linux-${arch}.tar.gz" ] && cp "aaykra-linux-${arch}.tar.gz" "aaykra-linux-${arch}.tar.gz" || true
            [ -f "aaykra-${arch}.dmg" ] && cp "aaykra-${arch}.dmg" "Aaykra-${arch}.dmg" || true
            [ -f "aaykra-remote-server-linux-${arch}.gz" ] && cp "aaykra-remote-server-linux-${arch}.gz" "aaykra-remote-server-linux-${arch}.gz" || true
            [ -f "aaykra-remote-server-macos-${arch}.gz" ] && cp "aaykra-remote-server-macos-${arch}.gz" "aaykra-remote-server-macos-${arch}.gz" || true
          done
          [ -f "aaykra-x86_64.exe" ] && cp "aaykra-x86_64.exe" "Aaykra-x86_64.exe" || true
          [ -f "aaykra-remote-server-windows-x86_64.gz" ] && cp "aaykra-remote-server-windows-x86_64.gz" "aaykra-remote-server-windows-x86_64.gz" || true
      - name: Write the release body
        run: |
          version="${{ needs.check_version.outputs.version }}"
          {
            cat .github/release/body.md
            echo
            echo "## What's new"
            echo
            script/changelog-section "$version"
            previous=$(git tag --sort=-v:refname | grep -vx "v${version}" | head -1)
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...v${version}"
            fi
          } > release-body.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: AAYKRA v${{ needs.check_version.outputs.version }}
          body_path: release-body.md
          files: artifacts/**

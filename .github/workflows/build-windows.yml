name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build_exe:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: Set-Content -Path crates/aaykra/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Build .exe installer
        run: ./script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - name: Verify package
        run: |
          Test-Path target/aaykra-x86_64.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: aaykra-exe
          path: target/aaykra-*.exe
          if-no-files-found: error

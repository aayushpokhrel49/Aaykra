name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
      # The hosted runner has 4 cores and 16 GB of RAM. The release profile
      # uses ThinLTO and one codegen unit, so four parallel rustc processes can
      # exhaust memory and take the runner offline. Keep the build conservative.
      CARGO_BUILD_JOBS: '2'
      # The packaged binaries are stripped anyway, so debug info only increases
      # peak linker memory and disk usage.
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/az \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            /usr/share/miniconda \
            /usr/local/lib/node_modules \
            /opt/google/chrome \
            /usr/local/share/chromium \
            /usr/share/java \
            /home/linuxbrew
          df -h
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-deb
      - name: Use the stable release channel
        run: echo stable > crates/aaykra/RELEASE_CHANNEL
      - name: Build Debian package
        run: ./script/bundle-deb
      - uses: actions/upload-artifact@v4
        with:
          name: aaykra-nightly-deb
          path: target/aaykra_*_*.deb
          if-no-files-found: error
          retention-days: 14

name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    name: Cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check
      - name: Check workspace
        run: cargo check --workspace --locked

  deb:
    name: Build .deb
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-deb
      - name: Use the stable release channel
        run: echo stable > crates/aaykra/RELEASE_CHANNEL
      - name: Build Debian package
        run: ./script/bundle-deb
      - uses: actions/upload-artifact@v4
        with:
          name: aaykra-nightly-deb
          path: target/aaykra_*_*.deb
          if-no-files-found: error
          retention-days: 14
